<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian to Latin Transliterator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 16px;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52,152,219,0.3);
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #34495e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Russian to Latin Transliterator</h1>
    
    <label for="input">Russian Cyrillic Input:</label>
    <textarea id="input" placeholder="Введите текст здесь..."></textarea>

    <label for="output">Latin Output:</label>
    <textarea id="output" readonly placeholder="Transliterated text will appear here..."></textarea>
</div>

<script>
    const inputArea = document.getElementById('input');
    const outputArea = document.getElementById('output');

    // Base standard mapping dictionary
    const baseMap = {
        'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ж': 'ž', 
        'з': 'z', 'и': 'i', 'й': 'j', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 
        'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f', 
        'х': 'x', 'ц': 'c', 'ч': 'č', 'ш': 'š', 'щ': 'ś', 'ъ': '',  'ы': 'y', 
        'ь': "'", 'э': 'è', 'ю': 'û', 'я': 'â', 'ё': 'ô',
        
        'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D', 'Е': 'E', 'Ж': 'Ž', 
        'З': 'Z', 'И': 'I', 'Й': 'J', 'К': 'K', 'Л': 'L', 'М': 'M', 'Н': 'N', 
        'О': 'O', 'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T', 'У': 'U', 'Ф': 'F', 
        'Х': 'X', 'Ц': 'C', 'Ч': 'Č', 'Ш': 'Š', 'Щ': 'Ś', 'Ъ': '',  'Ы': 'Y', 
        'Ь': "'", 'Э': 'È', 'Ю': 'Û', 'Я': 'Â', 'Ё': 'Ô'
    };

    // Set of characters classified as vowels or signs triggering the 'j' rule
    const triggers = new Set([
        'а', 'е', 'ё', 'и', 'о', 'у', 'ы', 'э', 'ю', 'я', 'ь', 'ъ',
        'А', 'Е', 'Ё', 'И', 'О', 'У', 'Ы', 'Э', 'Ю', 'Я', 'Ь', 'Ъ'
    ]);

    // Context-dependent rules for special letters (losing circumflex, gaining j)
    const modifiedMap = {
        'ё': 'jo', 'ю': 'ju', 'я': 'ja', 'э': 'je', 'е': 'je',
        'Ё': 'Jo', 'Ю': 'Ju', 'Я': 'Ja', 'Э': 'Je', 'Е': 'Je'
    };

    // Helper to determine if a Cyrillic character is part of a word
    function isCyrillicLetter(char) {
        if (!char) return false;
        return /[а-яё]/i.test(char);
    }

    function transliterate(text) {
        let result = "";
        
        for (let i = 0; i < text.length; i++) {
            let current = text[i];
            let previous = i > 0 ? text[i - 1] : null;

            // Check if current character is one of the special characters (е, ё, э, ю, я)
            if (modifiedMap[current] !== undefined) {
                let isStartOfWord = !previous || !isCyrillicLetter(previous);
                let isAfterTrigger = previous && triggers.has(previous);

                if (isStartOfWord || isAfterTrigger) {
                    result += modifiedMap[current];
                } else {
                    result += baseMap[current];
                }
            } else if (baseMap[current] !== undefined) {
                result += baseMap[current];
            } else {
                result += current; // Keep spaces, punctuation, numbers intact
            }
        }
        return result;
    }

    inputArea.addEventListener('input', () => {
        outputArea.value = transliterate(inputArea.value);
    });
</script>

</body>
</html>
