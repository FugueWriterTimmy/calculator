<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Modern Greek Derivator</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; width: 490px; border: 1px solid #334155; }
        .row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select, button { width: 100%; background: #020617; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; }
        button { background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; margin-top: 5px; }
        button:hover { background: #0369a1; }
        #out { margin-top: 15px; padding: 12px; background: #020617; border-radius: 8px; display: none; }
        #w { font-size: 1.8rem; margin: 0; color: #38bdf8; font-weight: 900; }
        #m { font-style: italic; color: #94a3b8; margin: 5px 0 0 0; }
    </style>
</head>
<body>
    <div class="box">
        <h3 style="margin:0 0 15px 0; text-align:center; color:#38bdf8; text-transform:uppercase;">Modern Greek Translator</h3>
        <div class="row">
            <input id="root" value="γραφ" placeholder="Root (e.g., γραφ, δουλ, σπιτ, φιλ)">
            <input id="mean" value="write" placeholder="Meaning">
        </div>
        <div class="row">
            <select id="p1"><option value="">[English Prefix ➔ Greek Equivalent]</option></select>
            <select id="suf"><option value="">[English Suffix ➔ Greek Equivalent]</option></select>
        </div>
        <button onclick="derive()">Translate & Derive</button>
        <div id="out"><h2 id="w"></h2><p id="m"></p></div>
    </div>

    <script>
        // High-yield native Modern Greek lexical prefixes with sandhi targets
        const P = [
            {en:"un- / dis- / non- (Negation) ➔ ξε", ru:"ξε", m:"un/dis"},
            {en:"anti- / counter- / opposing ➔ αντι", ru:"αντι", m:"anti"},
            {en:"co- / con- / sym- (Jointly) ➔ συν", ru:"συν", m:"co"},
            {en:"over- / excessive / hyper- ➔ υπερ", ru:"υπερ", m:"over/hyper"},
            {en:"sub- / under- / hypo- ➔ υπο", ru:"υπο", m:"sub/under"},
            {en:"pre- / fore- / before ➔ προ", ru:"προ", m:"pre/before"},
            {en:"re- / back- / retro- ➔ ανα", ru:"ανα", m:"re/back"},
            {en:"out- / ex- / exterior ➔ εκ", ru:"εκ", m:"out/ex"},
            {en:"in- / into- / interior ➔ εισ", ru:"εισ", m:"into"},
            {en:"mis- / bad- / mal- ➔ κακο", ru:"κακο", m:"bad/mal"},
            {en:"good- / well- / bene- ➔ ευ", ru:"ευ", m:"good/well"},
            {en:"through- / trans- / cross- ➔ δια", ru:"δια", m:"through"},
            {en:"around- / circum- / peri- ➔ περι", ru:"περι", m:"around"}
        ];

        // Modern Greek derivational suffixes with mutation and truncation properties
        const S = [
            {en:"-tion / -ment / -ing (Action Noun) ➔ ηση", ru:"ηση", m:"process", mut:1, trunc:1},
            {en:"-ness / -ity (Abstract Noun) ➔ οτητα", ru:"οτητα", m:"quality", trunc:1},
            {en:"-ship / -hood (Abstract State) ➔ συνη", ru:"συνη", m:"status", trunc:1},
            {en:"-er / -or / -ist (Masculine Agent) ➔ της", ru:"της", m:"agent", mut:1},
            {en:"-er / -ist (Feminine Agent) ➔ τρια", ru:"τρια", m:"female agent", mut:1},
            {en:"-facility / -ery / -place of work ➔ ειο", ru:"ειο", m:"location", trunc:1},
            {en:"-arium / -container / -spot ➔ αδικο", ru:"αδικο", m:"shop/venue", trunc:1},
            {en:"-y / -ie / -ling (Diminutive Neuter) ➔ ακι", ru:"ακι", m:"little", trunc:1},
            {en:"-ic / -al / -ous (Adjective format) ➔ ικος", ru:"ικος", m:"adjective", trunc:1},
            {en:"-ful / -bearing / -laden ➔ ατος", ru:"ατος", m:"full of", trunc:1},
            {en:"-less / -free / -void ➔ αρης", ru:"αρης", m:"characterized by", trunc:1},
            {en:"-ize / -ate / -ify (Verb Infinitive base) ➔ ιζω", ru:"ιζω", m:"verb action", trunc:1},
            {en:"-ly (Adverbial manner) ➔ α", ru:"α", m:"adverb", trunc:1}
        ];

        // Greek morphophonemic consonant mutations triggered before front vowels/suffixes
        // Covers common historical/vernacular alterations like dental spirantization
        const MUTS = {'τ':'σ', 'θ':'σ', 'π':'φ', 'κ':'χ'};

        const pSel = document.getElementById('p1'), sSel = document.getElementById('suf');
        P.forEach(p => pSel.add(new Option(p.en, p.ru)));
        S.forEach((s, idx) => sSel.add(new Option(s.en, idx)));

        function derive() {
            let r = document.getElementById('root').value.trim().toLowerCase(), rm = document.getElementById('mean').value.trim().toLowerCase();
            let pOpt = pSel.options[pSel.selectedIndex], sOpt = sSel.options[sSel.selectedIndex];
            if(!r) return alert("Enter root");

            let pData = P.find(x => x.ru === pOpt.value), sData = S[sOpt.value], p = pOpt.value, suf = sData ? sData.ru : '';

            // 1. Greek Vowel Truncation (Stem Elision)
            // If the root ends in a dictionary vowel, drop it before appending a vowel suffix
            if (sData?.trunc) {
                let last = r.slice(-1);
                if ('αεηιουω'.includes(last)) r = r.slice(0, -1);
            }

            // 2. Consonant Mutation 
            // Handles final stem transformations before specific nominal suffixes
            if (sData?.mut) {
                let end = r.slice(-1);
                if (MUTS[end]) r = r.slice(0, -1) + MUTS[end];
            }

            // 3. Greek Prefix Sandhi & Vowel Elision
            // Prefixes ending in vowels drop their last vowel if the root starts with a vowel (e.g., αντι- + ακουω = αντακουω)
            if (p && 'αεηιουω'.includes(p.slice(-1)) && 'αεηιουω'.includes(r.charAt(0)) && p !== 'προ') {
                p = p.slice(0, -1);
            }

            // 4. Prefix Nasal Assimilation (συν-)
            // συν- transforms into συμ- before labials (π, β, φ), συγ- before velars (κ, γ, χ), and συσ- before sibilants
            if (p === 'συν' && r.length > 0) {
                let first = r.charAt(0);
                if ('πβφψ'.includes(first)) p = 'συμ';
                else if ('κγχξ'.includes(first)) p = 'συγ';
                else if ('σζ'.includes(first)) p = 'συσ';
            }

            document.getElementById('w').innerText = p + r + suf;
            document.getElementById('m').innerText = [pData?.m, rm?`"${rm}"`:'', sData?.m].filter(Boolean).map(x => `[${x}]`).join(' + ');
            document.getElementById('out').style.display = 'block';
        }
    </script>
</body>
</html>
